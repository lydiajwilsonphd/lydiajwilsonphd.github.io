<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Professional profile for Lydia J. Wilson, PhD, DABR, medical physicist and faculty member in Radiation Oncology at Thomas Jefferson University.">
  <title>Lydia J. Wilson, PhD, DABR</title>

  <style>
    :root {
      --background: #0a0a0a;
      --panel: #111111;
      --text: #d0d0d0;
      --muted: #aeb2b7;
      --border: #343434;
      --accent: #d0d0d0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(circle at top, #182230 0%, var(--background) 42%),
        var(--background);
      color: var(--text);
      font-family: "Avenir Next LT Pro", "Avenir Next", Avenir, Montserrat,
                   "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 430px);
      padding: 34px 28px 30px;
      text-align: center;
      background: rgba(17, 17, 17, 0.94);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
    }

    .headshot {
      width: 148px;
      height: 148px;
      object-fit: cover;
      object-position: 50% 23%;
      border-radius: 50%;
      border: 2px solid #70757c;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
    }

    h1 {
      margin: 24px 0 8px;
      color: var(--text);
      font-size: clamp(1.45rem, 6vw, 1.9rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.065em;
      text-transform: uppercase;
    }

    .credentials {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.13em;
    }

    .role {
      margin: 0 auto 26px;
      max-width: 340px;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 13px 18px;
      color: var(--text);
      background: #171717;
      border: 1px solid #454545;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 150ms ease, border-color 150ms ease,
                  background-color 150ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      background: #202020;
      border-color: #aeb2b7;
      outline: none;
    }

    footer {
      margin-top: 25px;
      color: #777c82;
      font-size: 0.7rem;
      letter-spacing: 0.07em;
    }

    @media (max-width: 420px) {
      main { padding: 28px 20px 25px; }
      .headshot { width: 132px; height: 132px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <img class="headshot" src="headshot.jpg" alt="Professional headshot of Lydia J. Wilson">

    <h1>Lydia J. Wilson</h1>
    <p class="credentials">PhD, DABR</p>

    <p class="role">
      Assistant Professor and Medical Physicist<br>
      Department of Radiation Oncology<br>
      Thomas Jefferson University
    </p>

    <nav aria-label="Professional profiles">
      <a class="button"
         href="https://www.linkedin.com/in/lydia-wilson-phd-dabr-4107383b/"
         target="_blank" rel="noopener noreferrer">LinkedIn</a>

      <a class="button"
         href="https://orcid.org/0000-0002-9959-9310"
         target="_blank" rel="noopener noreferrer">ORCID</a>

      <a class="button"
         href="https://www.jefferson.edu/academics/colleges-schools-institutes/skmc/departments/radiation-oncology/faculty/directory/wilson.html"
         target="_blank" rel="noopener noreferrer">Jefferson Faculty Profile</a>
    </nav>

    <footer>Professional profile</footer>
  </main>
</body>
</html>
