<title>Lydia J. Wilson, PhD, DABR</title>

<style>
:root {
  --background:#0a0a0a;
  --panel:#111111;
  --text:#d0d0d0;
  --muted:#aeb2b7;
  --border:#343434;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:32px 18px;

  background:
  radial-gradient(circle at top,#182230 0%,#0a0a0a 42%),
  #0a0a0a;

  color:var(--text);

  font-family:
    "Avenir Next LT Pro",
    "Avenir Next",
    Avenir,
    Montserrat,
    "Segoe UI",
    Arial,
    sans-serif;
}

main{
  width:min(100%,430px);

  padding:34px 28px 30px;

  text-align:center;

  background:rgba(17,17,17,.95);

  border:1px solid var(--border);
  border-radius:22px;

  box-shadow:0 22px 70px rgba(0,0,0,.4);
}

.headshot{
  width:150px;
  height:150px;

  object-fit:cover;
  object-position:50% 23%;

  border-radius:50%;

  border:2px solid #666;

  box-shadow:0 10px 28px rgba(0,0,0,.4);
}

h1{
  margin:24px 0 8px;

  font-weight:500;

  text-transform:uppercase;

  letter-spacing:.08em;

  font-size:1.9rem;
}

.credentials{
  margin:0 0 22px;

  color:var(--muted);

  letter-spacing:.18em;
}

.role{
  margin:0 auto 10px;

  max-width:340px;

  color:var(--muted);

  line-height:1.7;
}

.track-image {
  display: block;
  width: 100%;
  height: auto;
  margin: -4px auto 24px;
  opacity: 0.9;
}

.email{
  margin-bottom:26px;

  color:#d0d0d0;
  text-decoration:none;
}

.email:hover{
  text-decoration:underline;
}

nav{
  display:grid;
  gap:12px;
}

.button{
  display:block;

  text-decoration:none;

  border:1px solid #454545;

  background:#171717;

  color:var(--text);

  padding:13px 18px;

  border-radius:10px;

  text-transform:uppercase;

  letter-spacing:.13em;

  font-size:.78rem;

  transition:all .15s ease;
}

.button:hover{
  transform:translateY(-2px);

  background:#202020;

  border-color:#aeb2b7;
}

.button.primary {
  background: #d0d0d0;
  color: #111111;
  border-color: #d0d0d0;
}

.button.primary:hover,
.button.primary:focus-visible {
  background: #ffffff;
  border-color: #ffffff;
}
  
footer{
  margin-top:24px;

  font-size:.72rem;

  color:#6d7278;

  letter-spacing:.08em;
}
</style>

</head>

<body>
